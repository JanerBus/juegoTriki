<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe Pro</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <!-- Librería de Confeti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</head>
<body>
    <!-- Efectos de fondo ambientales -->
    <div class="background-effects">
        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>
    </div>

    <main class="app-container">
        <header>
            <h1>Tic-Tac-Toe</h1>
            <p class="subtitle">El clásico, rediseñado.</p>
        </header>

        <div class="game-wrapper">
            <!-- Controles Adicionales -->
            <div class="controls-section">
                <div class="top-actions">
                    <button id="btn-config" class="btn-secondary">⚙️ Personalizar</button>
                </div>

                <!-- Selector de Modo -->
                <div class="segmented-control mt-15">
                    <input type="radio" id="modo-1v1" name="modo" value="1v1" checked>
                    <label for="modo-1v1" class="segment">
                        <span>👥 1 vs 1</span>
                    </label>
                    
                    <input type="radio" id="modo-vsMaquina" name="modo" value="vsMaquina">
                    <label for="modo-vsMaquina" class="segment">
                        <span>🤖 vs IA</span>
                    </label>
                    <div class="slider"></div>
                </div>
                
                <!-- Opciones IA -->
                <div class="dificultad-selector oculto" id="selector-dificultad">
                    <label for="dificultad">Nivel de IA:</label>
                    <select id="dificultad" class="select-moderno">
                        <option value="facil">Fácil 🐣</option>
                        <option value="medio" selected>Medio 🧠</option>
                        <option value="imposible">Imposible 😈</option>
                    </select>
                </div>
            </div>

            <!-- Marcador -->
            <div class="marcador">
                <div class="jugador-score">
                    <span class="etiqueta" id="etiqueta-x">Jugador X</span>
                    <span class="puntaje" id="score-x">0</span>
                </div>
                <div class="empates-score">
                    <span class="etiqueta">Empates</span>
                    <span class="puntaje" id="score-empates">0</span>
                </div>
                <div class="jugador-score">
                    <span class="etiqueta" id="etiqueta-o">Jugador O</span>
                    <span class="puntaje" id="score-o">0</span>
                </div>
            </div>

            <!-- Tablero y Estado -->
            <div class="board-container">
                <div class="status-badge" id="estado">Turno de X</div>
                <div class="tablero" id="tablero">
                    <div class="celda" data-indice="0"></div>
                    <div class="celda" data-indice="1"></div>
                    <div class="celda" data-indice="2"></div>
                    <div class="celda" data-indice="3"></div>
                    <div class="celda" data-indice="4"></div>
                    <div class="celda" data-indice="5"></div>
                    <div class="celda" data-indice="6"></div>
                    <div class="celda" data-indice="7"></div>
                    <div class="celda" data-indice="8"></div>
                </div>
            </div>

            <!-- Botones de Acción -->
            <div class="botones-acciones">
                <button id="reiniciar" class="btn-primary">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                    Siguiente Ronda
                </button>
                <button id="reset-marcador" class="btn-secondary">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                    Reiniciar Marcador
                </button>
            </div>
        </div>
    </main>

    <!-- Modal Configuración -->
    <div id="modal-config" class="modal">
        <div class="modal-contenido">
            <h2>Personalizar Partida</h2>
            
            <div class="ajuste-grupo">
                <h3>Jugador 1 (Empieza)</h3>
                <div class="input-row">
                    <input type="text" id="nombre-j1" class="input-moderno" placeholder="Nombre">
                    <select id="ficha-j1" class="select-moderno">
                        <option value="X">X</option>
                        <option value="🐶">🐶</option>
                        <option value="🍕">🍕</option>
                        <option value="⚔️">⚔️</option>
                        <option value="🌟">🌟</option>
                    </select>
                </div>
            </div>

            <div class="ajuste-grupo">
                <h3>Jugador 2 / Máquina</h3>
                <div class="input-row">
                    <input type="text" id="nombre-j2" class="input-moderno" placeholder="Nombre">
                    <select id="ficha-j2" class="select-moderno">
                        <option value="O">O</option>
                        <option value="🐱">🐱</option>
                        <option value="🍔">🍔</option>
                        <option value="🛡️">🛡️</option>
                        <option value="🔥">🔥</option>
                        <option value="🤖">🤖</option>
                    </select>
                </div>
            </div>

            <button id="btn-guardar-config" class="btn-primary" style="width: 100%; justify-content: center; margin-top: 15px;">Guardar y Reiniciar</button>
            <button id="btn-cerrar-config" class="btn-secondary" style="width: 100%; justify-content: center; margin-top: 10px;">Cancelar</button>
        </div>
    </div>

    <!-- Footer Minimalista -->
    <footer class="modern-footer">
        <div class="footer-grid">
            <div class="footer-col">
                <span class="label">Desarrollador</span>
                <span class="value">Janer Andrés Bustillo</span>
            </div>
            <div class="footer-col">
                <span class="label">Especialidad</span>
                <span class="value">Full Stack & IA</span>
            </div>
            <div class="footer-col">
                <span class="label">Institución</span>
                <span class="value">Univ. de Santander</span>
            </div>
            <div class="footer-col">
                <span class="label">Año</span>
                <span class="value">2026</span>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
